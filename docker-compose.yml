services:
  # El Motor de Base de Datos
  postgres:
    build:
      context: ./postgres
    container_name: dk-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shogun7 # ← Cambia por tu clave real
      POSTGRES_DB: dknotes
    security_opt:
      - label:disable
    userns_mode: "keep-id"
    volumes:
      - /var/home/datenmaniak/pg-data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:Z # Scripts de inicialización
    networks:
      - dk-network
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dknotes" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # El Procesador de PHP (Laravel)
  laravel:
    build:
      context: .
      dockerfile: laravel/Dockerfile-8422_fpm-alpine
      container_name: dknotes-laravel
    image: local-reg.dk.lab:5000/dknotes-laravel:beta-1.56.6
    security_opt:
      - label:disable
    userns_mode: "keep-id"
    volumes:
      - ./app:/var/www/html
      # - ~/notes:/var/www/html/storage/app/public/notes   # Directorio de notas 
      # - ~/notes/images:/var/www/html/public/images   # Directorio de imagenes de las notas
    networks:
      - dk-network
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "php-fpm", "-t" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # El Servidor Web (Nginx)
  nginx:
    build:
      context: ./nginx
    container_name: dk-proxy
    restart: always
    #    security_opt:
    #      - label:disable
    #    userns_mode: "keep-id"
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html:Z
      # mi propia configuracion
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:Z
    networks:
      - dk-network
    depends_on:
      laravel:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  dk-network:
    external: true
    name: dk-network
