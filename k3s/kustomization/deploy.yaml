apiVersion: apps/v1
kind: Deployment
metadata:
  name: dknotes-web
  namespace: dknotes
  labels:
    app: dknotes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dknotes
  template:
    metadata:
      labels:
        app: dknotes
    spec:
      # ============================================
      # VOLÚMENES DEL POD
      # ============================================
      volumes:
      # Volumen compartido para el código de la aplicación
      - name: app-code
        emptyDir: {}
      # Volumen persistente para storage (archivos subidos, logs, cache)
      - name: storage-persistence
        persistentVolumeClaim:
          claimName: dknotes-uploads-pvc
      # Configuración de Nginx
      - name: nginx-config-volume
        configMap:
          name: nginx-config
      # ============================================
      # INITCONTAINER: Copia el código al volumen compartido
      # ============================================
      initContainers:
      - name: copy-code
        image: local-reg.dk.lab:5000/dknotes-laravel:1.58.7 # {"$imagepolicy": "flux-system:dknotes-laravel"}
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - |
          echo "Copiando código de la aplicación..."
          cp -r /var/www/html/. /app-code/

          # echo "Código copiado exitosamente"
          # ls -la /app-code/

          # Crear estructura de framework si no existe (para nuevos deployments)
          mkdir -p /app-code/storage/framework/{cache,sessions,views,testing}

          chown -R 33:33 /app-code/storage || true
          chmod -R 775 /app-code/storage || true

          echo "Setup completado"
          ls -la /app-code/storage/framework/
        volumeMounts:
        - name: app-code
          mountPath: /app-code
      # ============================================
      # CONTENEDORES PRINCIPALES
      # ============================================
      containers:
      # ----------------------------------------------------
      # 1. CONTENEDOR NGINX (Servidor Web)
      # ----------------------------------------------------
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        # Código de la aplicación (solo lectura para Nginx)
        - name: app-code
          mountPath: /var/www/html
          readOnly: true
        # Configuración personalizada de Nginx
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        # Health check
        livenessProbe:
          httpGet: {path: /health, port: 80}
          initialDelaySeconds: 20
          periodSeconds: 20
        readinessProbe:
          httpGet: {path: /health, port: 80}
          initialDelaySeconds: 10
          periodSeconds: 15
      # ----------------------------------------------------
      # 2. CONTENEDOR PHP-FPM (Laravel)
      # ----------------------------------------------------
      - name: web-app
        # El marcador # {"$imagepolicy": "flux-system:dknotes-laravel"} le dice a Flux
        #  exactamente qué policy usar para actualizar esta línea.

        image: local-reg.dk.lab:5000/dknotes-laravel:1.58.7 # {"$imagepolicy": "flux-system:dknotes-laravel"}
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
          name: fastcgi
        # Variables de entorno
        env:
        # Configuración general de Laravel
        - name: APP_ENV
          value: "production"
        - name: APP_DEBUG
          value: "true"
        - name: APP_URL
          value: "https://dknotes.dk.lab"
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: dknotes-secrets
              key: app_key
        # Conexión a PostgreSQL
        - name: DB_CONNECTION
          value: "pgsql"
        - name: DB_HOST
          value: "postgres-service.postgres.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_DATABASE
          value: "dknotes"
        # Credenciales desde Secret
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: dknotes-secrets
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dknotes-secrets
              key: password
        # Recursos
        resources:
          limits:
            cpu: "500m"
            memory: "640Mi"
          requests:
            cpu: "300m"
            memory: "512Mi"
        # Volúmenes
        volumeMounts:
        # Código de la aplicación (lectura/escritura para Laravel)
        - name: app-code
          mountPath: /var/www/html
        # Persistencia para archivos subidos y datos
        - name: storage-persistence
          mountPath: /var/www/html/storage
        # Health check para PHP-FPM
        livenessProbe:
          tcpSocket: {port: 9000}
          initialDelaySeconds: 40 # Aumentado para evitar reinicios en frío
          periodSeconds: 20 # Menos chequeos al socket
        readinessProbe:
          tcpSocket: {port: 9000}
          initialDelaySeconds: 15
          periodSeconds: 15 # Menos chequeos al socket
